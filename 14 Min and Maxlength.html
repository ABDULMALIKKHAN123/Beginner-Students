<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- minlength → characters के लिए -->
     <!-- min → number/date -->
    <form>
        <label for="name">Name:</label>
        <input type="text" minlength="3" maxlength="20" id="name" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" minlength="8" maxlength="16" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" min="18" max="60" required><br><br>
        
    </form>
</body>
</html>
