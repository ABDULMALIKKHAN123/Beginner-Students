<!-- Radio Button का उपयोग तब होता है जब User एक ही Option चुन सकता है।
Checkbox का उपयोग तब होता है जब User एक से अधिक Option चुन सकता है। -->
<!-- <input type="checkbox" id="html">
<label for="html">HTML</label> -->

<form >
    <label for="name">Name:</label>
    <input type="text" placeholder="Enter your name" id="name"><br><br>

    <label for="email">Email:</label>
    <input type="email" placeholder = "Enter your email"id="email"><br><br>

    <label for="password">Password:</label>
    <input type="password" placeholder = "Enter your password" id="password"><br><br>

    <label for="gender">Gender:</label><br>

    <input type="radio" name="gender" id="male">
    <label for="male">Male</label><br>

    <input type="radio" name="gender" id="female">
    <label for="female">Female</label><br>

    <input type="radio" name="gender" id="other">
    <label for="other">Other</label><br>



    <label for="Your skill">Your Skill:</label><br>
    
    
    <input type="checkbox" name="skill" id="html">
    <label for="html">HTML</label><br>

    <input type="checkbox" name = "skill" id ="css">
    <label for="css">CSS</label><br>

    <input type="checkbox" name = "skill" id="javascript">
    <label for="javascript">JavaScript</label><br>

    <input type="checkbox" name ="skill" id = "python">
    <label for="python">Python</label><br>

    <input type="submit" value="Submit">
</form>
