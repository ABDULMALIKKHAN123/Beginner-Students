    <!-- pattern का इस्तेमाल तब करते हैं जब हमें input का specific format चाहिए। -->

        <!-- जब हमें user से एक से ज्यादा lines का text लेना हो, तब <textarea> इस्तेमाल करते हैं। -->
            <!-- <label for="address">Address</label>

                 <option value="cse">CSE</option>

            </select><br>
            <button type="submit">Submit</button>

     <!-- disabled → option select नहीं कर सकते
          selected → शुरुआत में यही दिखेगा
          required → actual branch select करना जरूरी -->
    <form>
    <label for="year">Select Your Year:</label>

    <select name="year" id="year" required>
        <option value="" disabled selected>Select Your Year</option>
        <option value="1st">1st Year</option>
        <option value="2nd">2nd Year</option>
        <option value="3rd">3rd Year</option>
        <option value="4th">4th Year</option>
    </select>

    <button type="submit">Submit</button>
</form>
