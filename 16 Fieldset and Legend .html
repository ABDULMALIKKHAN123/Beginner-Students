<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information</title>
</head>
<body>
    <fieldset>
    <legend>Personal Information</legend>

    <label for="name">Name:</label>
    <input type="text" id="name" required>

    <label for="email">E-mail:</label>
    <input type="email" id="email" required>

    <label for="number">Mobile No.:</label>
    <input type="text" id="number">

    <label for="college">College:</label>
    <input type="text" id="college">

    <label for="password"></label>
    <input type="password" id="password"><br>

    <label for="gender">Gender:</label><br>

    <label for="male">Male</label>
    <input type="radio" id="male" name="gender"><br>

    <label for="female">Female</label>
    <input type="radio" id="female" name="gender"><br>

    <label for="other">Other</label>
    <input type="radio" id="other" name="gender"><br>

    <label for="Subject">Select your favorite subject:</label><br>

    <label for="html">HTML</label>
    <input type="checkbox" name="subject" id="html"><br>

    <label for="css">CSS</label>
    <input type="checkbox" name="subject" id="css"><br>

    <label for="js">JavaScript</label>
    <input type="checkbox" name="subject" id="js">

     <input type="submit">

     <!-- isme dikkat ye aa rahi hai ki required karne par apply nahi ho raha hai -->
</fieldset>
</body>
</html>
